<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/sentinelhubapp/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sentinel_hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sentinel_hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .download-apk-container {
      display: flex;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.02), transparent);
    }

    .download-apk-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.95rem 1.4rem;
      min-width: 220px;
      border-radius: 999px;
      border: 1px solid #00bcd4;
      background-color: #00bcd4;
      color: #0a0a0a;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .download-apk-button:hover,
    .download-apk-button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.16);
      background-color: #00d5e8;
    }

    @media (max-width: 480px) {
      .download-apk-container {
        padding: 0.75rem;
      }
      .download-apk-button {
        width: 100%;
        min-width: auto;
        padding: 0.95rem 1rem;
        font-size: 0.98rem;
      }
    }
  </style>
</head>
<body>
  <div class="download-apk-container">
    <a class="download-apk-button" href="https://github.com/vtrkenji/sentinelhubapp/releases" target="_blank" rel="noopener noreferrer">
      <span>⬇️</span>
      <span>Baixar APK para Android</span>
    </a>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
