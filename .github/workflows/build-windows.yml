name: Build Windows

on:
  push:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Windows
      run: flutter build windows --release

    - name: Zip release assets
      run: |
        powershell Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sentinel_hub_windows_x64.zip

    # Salva o .zip do Windows na aba Actions a cada push
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-hub-windows
        path: sentinel_hub_windows_x64.zip

    # Envia para o Release apenas se o gatilho for uma publicação oficial
    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: sentinel_hub_windows_x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}