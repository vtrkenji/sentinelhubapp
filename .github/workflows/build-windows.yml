name: Build Windows

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Windows
      run: flutter build windows --release

    - name: Zip release assets
      run: |
        powershell Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sentinel_hub_windows_x64.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: sentinel_hub_windows_x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
