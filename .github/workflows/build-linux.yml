name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Instalar dependências do Linux (MPV, GTK e Ferramentas)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libappindicator3-dev libmpv-dev mpv

    - name: Install dependencies
      run: flutter pub get

    - name: Enable Desktop Support
      run: flutter config --enable-linux-desktop
      
    - name: Injetar versão da Tag no pubspec
      run: |
        # Pega a tag (ex: v1.0.8) e tira a letra 'v'
        TAG_NAME=${{ github.ref_name }}
        VERSION_NUMBER=${TAG_NAME#v}
        
        # Substitui a linha "version:" do pubspec.yaml
        sed -i "s/^version: .*/version: $VERSION_NUMBER+1/g" pubspec.yaml

    - name: Build Linux
      run: flutter build linux --release

    - name: Compress Build
      run: |
        cd build/linux/x64/release/bundle
        tar -czvf ../../../../../sentinel_hub_linux_x64.tar.gz .
        cd ../../../../../

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-hub-linux
        path: sentinel_hub_linux_x64.tar.gz

    - name: Automatic Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Release ${{ github.ref_name }}"
        body: "Versão Linux atualizada."
        files: sentinel_hub_linux_x64.tar.gz
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}