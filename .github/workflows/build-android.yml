name: Build Android (APK)

on:
  push:
    branches: [ "main" ] # Dispara automaticamente a cada git push!
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5 # Atualizado para v5 (remove o aviso amarelo)
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Rename APK
      run: mv build/app/outputs/flutter-apk/app-release.apk sentinel_hub_android.apk

    # NOVO: Salva o APK na aba "Actions" para você baixar a cada git push
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-hub-apk
        path: sentinel_hub_android.apk

    # AJUSTADO: Só tenta anexar no Release se o gatilho foi a criação de um Release
    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: sentinel_hub_android.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}