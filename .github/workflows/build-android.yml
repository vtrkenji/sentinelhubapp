name: Build Android (APK)

on:
  push:
    tags:
      - 'v*' # Dispara a build SOMENTE quando você enviar uma tag, ex: git push origin v1.0.5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get
      
    - name: Injetar versão da Tag no pubspec
      run: |
        # Pega a tag (ex: v1.0.8) e tira a letra 'v'
        TAG_NAME=${{ github.ref_name }}
        VERSION_NUMBER=${TAG_NAME#v}
        
        # Substitui a linha "version:" do pubspec.yaml
        sed -i "s/^version: .*/version: $VERSION_NUMBER+1/g" pubspec.yaml

    - name: Configurar assinatura de release (mesma keystore em toda build)
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
        cat > android/key.properties <<EOF
        storeFile=upload-keystore.jks
        storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
        keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
        EOF

    - name: Build APK
      run: flutter build apk --release

    - name: Rename APK
      run: mv build/app/outputs/flutter-apk/app-release.apk sentinel_hub_android.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-hub-apk
        path: sentinel_hub_android.apk

    - name: Automatic Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }} # Pega dinamicamente o nome da tag (ex: v1.0.5)
        name: "Release ${{ github.ref_name }}"
        body: "Versão atualizada automaticamente via GitHub Actions."
        files: sentinel_hub_android.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}