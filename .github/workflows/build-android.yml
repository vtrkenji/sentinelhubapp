name: Deploy App/Site to GitHub Pages

on:
  push:
    branches: [ main ]

# PERMISSÕES OBRIGATÓRIAS PARA O GITHUB PAGES
permissions:
  contents: read
  pages: write
  id-token: write

# CONCORRÊNCIA PARA EVITAR DEPLOYS SIMULTÂNEOS
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ... (suas etapas de build do Flutter / Web aqui) ...

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web' # Ou a pasta de saída do seu build web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4