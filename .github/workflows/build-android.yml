name: Build Android (APK)

on:
  push:
    branches: [ "main" ] # Dispara automaticamente a cada git push!
  workflow_dispatch: # Permite apertar o botão de compilar manualmente se precisar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Rename APK
      run: mv build/app/outputs/flutter-apk/app-release.apk sentinel_hub_android.apk

    # Salva o APK na aba "Actions" (como backup)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-hub-apk
        path: sentinel_hub_android.apk

    # NOVO: Cria/Atualiza sempre a Release com a tag "latest"
    - name: Automatic Latest Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Versão Mais Recente (Auto-Build)"
        body: "Esta versão é compilada e atualizada automaticamente a cada modificação no código."
        files: sentinel_hub_android.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}